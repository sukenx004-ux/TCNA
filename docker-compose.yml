services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proof
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL in .env}
      DATABASE_URL: postgresql+psycopg://proof:${POSTGRES_PASSWORD}@db:5432/proof
      PROOF_DATA_DIR: /app/data
      PROOF_ENCRYPTION_KEY: ${PROOF_ENCRYPTION_KEY:?Set PROOF_ENCRYPTION_KEY in .env}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-15}
      COOKIE_SECURE: "true"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_FILES_PER_REPORT: ${MAX_FILES_PER_REPORT:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - proof_data:/app/data
    expose:
      - "8000"
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--no-access-log","--proxy-headers","--forwarded-allow-ips=*"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  proof_data:
  caddy_data:
  caddy_config:
